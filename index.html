<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Tech Combat Team — Texas Robot Combat</title>
  <meta name="description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta name="theme-color" content="#0055A4" />
  <meta property="og:title" content="Wolf Tech Combat Team" />
  <meta property="og:description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill" id="progressFill"></div></div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav__inner wrap">
      <a class="brand" href="#top" aria-label="Wolf Tech Combat Team — home">
        <img class="brand__logo" src="logo.png" alt="" />
        <span class="brand__name" id="brandName"></span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
      <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMobile" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" role="dialog" aria-label="Mobile menu"></div>
  </header>

  <main id="main">

    <!-- HERO — two-column split: text left, weapon visual right -->
    <section class="hero" id="top">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__grid-lines"></div>
      </div>
      <!-- Animated weapon visual: a single spinning circular-saw blade (SVG, no stock photos) -->
      <div class="weapon-stage" aria-hidden="true">
        <div class="saw">
          <svg class="saw__svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sawMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#DCE3EE" />
                <stop offset="45%" stop-color="#8B95A8" />
                <stop offset="55%" stop-color="#5A6478" />
                <stop offset="100%" stop-color="#2C3344" />
              </linearGradient>
              <polygon id="sawTooth" points="100,2 94,24 106,24" />
            </defs>
            <g class="saw__spin">
              <circle cx="100" cy="100" r="78" fill="url(#sawMetal)" stroke="#141820" stroke-width="2" />
              <g fill="url(#sawMetal)" stroke="#141820" stroke-width="1">
                <use href="#sawTooth" transform="rotate(0 100 100)" />
                <use href="#sawTooth" transform="rotate(20 100 100)" />
                <use href="#sawTooth" transform="rotate(40 100 100)" />
                <use href="#sawTooth" transform="rotate(60 100 100)" />
                <use href="#sawTooth" transform="rotate(80 100 100)" />
                <use href="#sawTooth" transform="rotate(100 100 100)" />
                <use href="#sawTooth" transform="rotate(120 100 100)" />
                <use href="#sawTooth" transform="rotate(140 100 100)" />
                <use href="#sawTooth" transform="rotate(160 100 100)" />
                <use href="#sawTooth" transform="rotate(180 100 100)" />
                <use href="#sawTooth" transform="rotate(200 100 100)" />
                <use href="#sawTooth" transform="rotate(220 100 100)" />
                <use href="#sawTooth" transform="rotate(240 100 100)" />
                <use href="#sawTooth" transform="rotate(260 100 100)" />
                <use href="#sawTooth" transform="rotate(280 100 100)" />
                <use href="#sawTooth" transform="rotate(300 100 100)" />
                <use href="#sawTooth" transform="rotate(320 100 100)" />
                <use href="#sawTooth" transform="rotate(340 100 100)" />
              </g>
              <!-- decorative bolt holes -->
              <circle cx="100" cy="50" r="7" fill="#141820" />
              <circle cx="141" cy="76" r="7" fill="#141820" />
              <circle cx="141" cy="124" r="7" fill="#141820" />
              <circle cx="100" cy="150" r="7" fill="#141820" />
              <circle cx="59" cy="124" r="7" fill="#141820" />
              <circle cx="59" cy="76" r="7" fill="#141820" />
              <!-- center arbor bolt -->
              <circle cx="100" cy="100" r="14" fill="#0A0C10" stroke="#3A9EFF" stroke-width="1.5" />
              <circle cx="100" cy="100" r="4" fill="#3A9EFF" />
            </g>
          </svg>
          <div class="saw__label">Circular Saw</div>
        </div>
        <!-- Rotating ring -->
        <div class="orbit-ring orbit-ring--outer"></div>
        <div class="orbit-ring orbit-ring--inner"></div>
        <!-- Center crosshair -->
        <div class="orbit-crosshair">
          <div class="orbit-crosshair__h"></div>
          <div class="orbit-crosshair__v"></div>
          <div class="orbit-crosshair__dot"></div>
        </div>
      </div>
      <div class="wrap hero__inner">
        <div class="hero__text" id="heroContent"></div>
      </div>
    </section>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="wrap stats-bar__inner" id="statsBar">
        <div class="stat-item"><span class="stat-item__num">Texas</span><span class="stat-item__lbl">Based In</span></div>
        <div class="stat-item"><span class="stat-item__num">2024</span><span class="stat-item__lbl">Founded</span></div>
        <div class="stat-item"><span class="stat-item__num">100%</span><span class="stat-item__lbl">Student-Built</span></div>
        <div class="stat-item"><span class="stat-item__num">3+</span><span class="stat-item__lbl">Frisco HS's</span></div>
      </div>
    </div>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="wrap about-layout" id="aboutContent"></div>
    </section>

    <!-- BOTS -->
    <section class="section section--dark" id="bots">
      <div class="wrap" id="botsContent"></div>
    </section>

    <!-- TEAM -->
    <section class="section" id="team">
      <div class="wrap" id="teamContent"></div>
    </section>

    <!-- SPONSORS -->
    <section class="section section--dark" id="sponsors">
      <div class="wrap" id="sponsorsContent"></div>
    </section>

    <!-- DONATE -->
    <section class="section section--blue" id="donate">
      <div class="wrap" id="donateContent"></div>
    </section>

    <!-- MISSION -->
    <section class="section" id="mission">
      <div class="wrap" id="missionContent"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap footer__inner" id="footerContent"></div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
