<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Tech Combat Team — Texas Robot Combat</title>
  <meta name="description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta name="theme-color" content="#0055A4" />
  <!-- Open Graph -->
  <meta property="og:title" content="Wolf Tech Combat Team" />
  <meta property="og:description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta property="og:type" content="website" />
  <!--
    NOTE: <title> and meta tags above are static copies of data.js values
    so crawlers that don't run JS still see correct text.
    If you change meta.title / meta.description in data.js, update these too.
  -->
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Scroll progress bar -->
  <div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill" id="progressFill"></div></div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav__inner wrap">
      <a class="brand" href="#top" aria-label="Wolf Tech Combat Team — home">
        <img class="brand__logo" src="logo.png" alt="" />
        <span class="brand__name" id="brandName"></span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
      <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMobile" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" role="dialog" aria-label="Mobile menu"></div>
  </header>

  <main id="main">

    <!-- HERO -->
    <section class="hero" id="top">
      <div class="wrap hero__inner" id="heroContent"></div>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="wrap" id="aboutContent"></div>
    </section>

    <!-- BOTS -->
    <section class="section section--dark" id="bots">
      <div class="wrap" id="botsContent"></div>
    </section>

    <!-- TEAM -->
    <section class="section" id="team">
      <div class="wrap" id="teamContent"></div>
    </section>

    <!-- SPONSORS -->
    <section class="section" id="sponsors">
      <div class="wrap" id="sponsorsContent"></div>
    </section>

    <!-- DONATE -->
    <section class="section section--blue" id="donate">
      <div class="wrap" id="donateContent"></div>
    </section>

    <!-- MISSION -->
    <section class="section section--dark" id="mission">
      <div class="wrap" id="missionContent"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="wrap footer__inner" id="footerContent"></div>
  </footer>

  <!-- data.js MUST load before script.js -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
