<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Tech Combat Team — Texas Robot Combat</title>
  <meta name="description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta name="theme-color" content="#0055A4" />
  <meta property="og:title" content="Wolf Tech Combat Team" />
  <meta property="og:description" content="Student-built combat robots. Designed, machined, and fought in the arenas of Texas Robot Combat." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill" id="progressFill"></div></div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav__inner wrap">
      <a class="brand" href="#top" aria-label="Wolf Tech Combat Team — home">
        <img class="brand__logo" src="logo.png" alt="" />
        <span class="brand__name" id="brandName"></span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
      <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMobile" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" role="dialog" aria-label="Mobile menu"></div>
  </header>

  <main id="main">

    <!-- HERO — two-column split: text left, weapon visual right -->
    <section class="hero" id="top">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__grid-lines"></div>
      </div>
      <!-- Spinning saw weapon visual -->
      <div class="weapon-stage" aria-hidden="true">
        <!-- Static outer rings / crosshair -->
        <div class="orbit-ring orbit-ring--outer"></div>
        <div class="orbit-ring orbit-ring--inner"></div>
        <div class="orbit-crosshair">
          <div class="orbit-crosshair__h"></div>
          <div class="orbit-crosshair__v"></div>
          <div class="orbit-crosshair__dot"></div>
        </div>
        <!-- Spinning circular saw blade SVG -->
        <div class="saw-wrap">
          <svg class="saw-blade" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="bladeGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.15"/>
                <stop offset="70%" stop-color="#1877D2" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#0055A4" stop-opacity="0.04"/>
              </radialGradient>
              <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#3A9EFF"/>
                <stop offset="60%" stop-color="#1877D2"/>
                <stop offset="100%" stop-color="#0055A4"/>
              </radialGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Tooth clip path for 28 teeth around edge -->
            </defs>

            <!-- Outer disc fill -->
            <circle cx="200" cy="200" r="188" fill="url(#bladeGrad)" stroke="#1877D2" stroke-width="1.5" opacity="0.6"/>

            <!-- Tooth ring — 28 triangular teeth generated around perimeter -->
            <!-- We draw teeth as a polygon approximating the saw edge -->
            <g filter="url(#glow)">
              <!-- Main disc body with teeth as a single path -->
              <path d="
                M 200 12
                L 210 28 L 222 14 L 228 32 L 242 20 L 244 38 L 260 28 L 258 47 L 275 39 L 270 58
                L 287 53 L 279 71 L 296 70 L 285 87 L 302 89 L 288 105 L 305 110 L 288 124
                L 305 132 L 285 143 L 300 155 L 278 162 L 291 177 L 268 180 L 278 197
                L 255 196 L 262 214 L 239 209 L 242 228 L 219 219 L 218 238 L 196 226
                L 191 245 L 172 229 L 163 248 L 148 228 L 135 246 L 124 223 L 108 238
                L 102 213 L 84 225 L 83 199 L 64 208 L 68 182 L 49 187 L 57 163
                L 38 163 L 51 141 L 32 137 L 49 118 L 30 110 L 51 95 L 33 83 L 57 72
                L 42 57 L 68 50 L 56 33 L 84 30 L 75 12 L 104 14 L 99 -4
                L 126 2 L 125 -16 L 150 -6 L 153 -24 L 176 -10 L 182 -27 L 200 -12
              " fill="none" stroke="#1877D2" stroke-width="2" opacity="0"/>

              <!-- Simpler: draw the toothed outer ring as repeated triangles -->
              <!-- 24 teeth, each rotated -->
            </g>

            <!-- Toothed perimeter — 24 evenly spaced teeth -->
            <g stroke="#1877D2" stroke-width="1.2" fill="#0D1520" filter="url(#glow)">
              <!-- Tooth 0 --> <polygon points="200,12 192,34 208,34" transform="rotate(0,200,200)" opacity="0.9"/>
              <!-- Tooth 1 --> <polygon points="200,12 192,34 208,34" transform="rotate(15,200,200)" opacity="0.9"/>
              <!-- Tooth 2 --> <polygon points="200,12 192,34 208,34" transform="rotate(30,200,200)" opacity="0.9"/>
              <!-- Tooth 3 --> <polygon points="200,12 192,34 208,34" transform="rotate(45,200,200)" opacity="0.9"/>
              <!-- Tooth 4 --> <polygon points="200,12 192,34 208,34" transform="rotate(60,200,200)" opacity="0.9"/>
              <!-- Tooth 5 --> <polygon points="200,12 192,34 208,34" transform="rotate(75,200,200)" opacity="0.9"/>
              <!-- Tooth 6 --> <polygon points="200,12 192,34 208,34" transform="rotate(90,200,200)" opacity="0.9"/>
              <!-- Tooth 7 --> <polygon points="200,12 192,34 208,34" transform="rotate(105,200,200)" opacity="0.9"/>
              <!-- Tooth 8 --> <polygon points="200,12 192,34 208,34" transform="rotate(120,200,200)" opacity="0.9"/>
              <!-- Tooth 9 --> <polygon points="200,12 192,34 208,34" transform="rotate(135,200,200)" opacity="0.9"/>
              <!-- Tooth 10 --> <polygon points="200,12 192,34 208,34" transform="rotate(150,200,200)" opacity="0.9"/>
              <!-- Tooth 11 --> <polygon points="200,12 192,34 208,34" transform="rotate(165,200,200)" opacity="0.9"/>
              <!-- Tooth 12 --> <polygon points="200,12 192,34 208,34" transform="rotate(180,200,200)" opacity="0.9"/>
              <!-- Tooth 13 --> <polygon points="200,12 192,34 208,34" transform="rotate(195,200,200)" opacity="0.9"/>
              <!-- Tooth 14 --> <polygon points="200,12 192,34 208,34" transform="rotate(210,200,200)" opacity="0.9"/>
              <!-- Tooth 15 --> <polygon points="200,12 192,34 208,34" transform="rotate(225,200,200)" opacity="0.9"/>
              <!-- Tooth 16 --> <polygon points="200,12 192,34 208,34" transform="rotate(240,200,200)" opacity="0.9"/>
              <!-- Tooth 17 --> <polygon points="200,12 192,34 208,34" transform="rotate(255,200,200)" opacity="0.9"/>
              <!-- Tooth 18 --> <polygon points="200,12 192,34 208,34" transform="rotate(270,200,200)" opacity="0.9"/>
              <!-- Tooth 19 --> <polygon points="200,12 192,34 208,34" transform="rotate(285,200,200)" opacity="0.9"/>
              <!-- Tooth 20 --> <polygon points="200,12 192,34 208,34" transform="rotate(300,200,200)" opacity="0.9"/>
              <!-- Tooth 21 --> <polygon points="200,12 192,34 208,34" transform="rotate(315,200,200)" opacity="0.9"/>
              <!-- Tooth 22 --> <polygon points="200,12 192,34 208,34" transform="rotate(330,200,200)" opacity="0.9"/>
              <!-- Tooth 23 --> <polygon points="200,12 192,34 208,34" transform="rotate(345,200,200)" opacity="0.9"/>
            </g>

            <!-- Main disc body -->
            <circle cx="200" cy="200" r="163" fill="#0A0D14" stroke="#1877D2" stroke-width="1.5"/>

            <!-- Inner structural details — concentric circles and spokes -->
            <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(58,158,255,0.2)" stroke-width="1"/>
            <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(58,158,255,0.15)" stroke-width="0.8"/>
            <circle cx="200" cy="200" r="80" fill="none" stroke="rgba(58,158,255,0.25)" stroke-width="1.2"/>
            <circle cx="200" cy="200" r="50" fill="#0D1520" stroke="rgba(58,158,255,0.35)" stroke-width="1.5"/>

            <!-- Spokes — 6 structural arms -->
            <g stroke="rgba(58,158,255,0.3)" stroke-width="1.5" fill="none">
              <line x1="200" y1="50" x2="200" y2="350"/>
              <line x1="200" y1="50" x2="200" y2="350" transform="rotate(60,200,200)"/>
              <line x1="200" y1="50" x2="200" y2="350" transform="rotate(120,200,200)"/>
            </g>

            <!-- Spoke highlight (thicker inner portion) -->
            <g stroke="rgba(58,158,255,0.5)" stroke-width="4" fill="none" stroke-linecap="round">
              <line x1="200" y1="80" x2="200" y2="155" filter="url(#glow)"/>
              <line x1="200" y1="245" x2="200" y2="320" filter="url(#glow)"/>
              <line x1="200" y1="80" x2="200" y2="155" transform="rotate(60,200,200)" filter="url(#glow)"/>
              <line x1="200" y1="245" x2="200" y2="320" transform="rotate(60,200,200)" filter="url(#glow)"/>
              <line x1="200" y1="80" x2="200" y2="155" transform="rotate(120,200,200)" filter="url(#glow)"/>
              <line x1="200" y1="245" x2="200" y2="320" transform="rotate(120,200,200)" filter="url(#glow)"/>
            </g>

            <!-- Arbor hole center -->
            <circle cx="200" cy="200" r="20" fill="#080A0E" stroke="#3A9EFF" stroke-width="2" filter="url(#glow)"/>
            <circle cx="200" cy="200" r="10" fill="url(#centerGrad)" opacity="0.8"/>

            <!-- Glint / speed lines on outer edge -->
            <g stroke="rgba(58,158,255,0.6)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
              <line x1="200" y1="37" x2="200" y2="20"/>
              <line x1="200" y1="37" x2="200" y2="20" transform="rotate(72,200,200)"/>
              <line x1="200" y1="37" x2="200" y2="20" transform="rotate(144,200,200)"/>
              <line x1="200" y1="37" x2="200" y2="20" transform="rotate(216,200,200)"/>
              <line x1="200" y1="37" x2="200" y2="20" transform="rotate(288,200,200)"/>
            </g>
          </svg>
          <!-- Speed blur ring underneath -->
          <div class="saw-blur-ring"></div>
          <div class="saw-label">Drum Spinner — FENRIR</div>
        </div>
      </div>
      <div class="wrap hero__inner">
        <div class="hero__text" id="heroContent"></div>
      </div>
    </section>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="wrap stats-bar__inner" id="statsBar">
        <div class="stat-item"><span class="stat-item__num">Based in Texas</span><span class="stat-item__lbl">Frisco, TX</span></div>
        <div class="stat-item"><span class="stat-item__num">Founded 2024</span><span class="stat-item__lbl">Established in Frisco, TX</span></div>
        <div class="stat-item"><span class="stat-item__num">100% Student-Built</span><span class="stat-item__lbl">Every part, every line of code</span></div>
        <div class="stat-item"><span class="stat-item__num">3+ Frisco HS's</span><span class="stat-item__lbl">Students from across the district</span></div>
      </div>
    </div>

    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="wrap about-layout" id="aboutContent"></div>
    </section>

    <!-- BOTS -->
    <section class="section section--dark" id="bots">
      <div class="wrap" id="botsContent"></div>
    </section>

    <!-- TEAM -->
    <section class="section" id="team">
      <div class="wrap" id="teamContent"></div>
    </section>

    <!-- SPONSORS -->
    <section class="section section--dark" id="sponsors">
      <div class="wrap" id="sponsorsContent"></div>
    </section>

    <!-- DONATE -->
    <section class="section section--blue" id="donate">
      <div class="wrap" id="donateContent"></div>
    </section>

    <!-- MISSION -->
    <section class="section" id="mission">
      <div class="wrap" id="missionContent"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap footer__inner" id="footerContent"></div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
