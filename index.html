<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Tech Combat Team — Student Combat Robotics</title>
  <meta name="description" content="Wolf Tech is a student-run combat robotics team from Frisco, TX. We design, machine, and fight our own robots." />
  <meta name="theme-color" content="#0055A4" />
  <meta property="og:title" content="Wolf Tech Combat Team" />
  <meta property="og:description" content="Student-built combat robots from Frisco, TX." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill" id="progressFill"></div></div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav__inner wrap">
      <a class="brand" href="#top" aria-label="Wolf Tech Combat Team home">
        <img class="brand__logo" src="logo.png" alt="" />
        <span class="brand__name">Wolf Tech</span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
      <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMobile" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav__mobile" id="navMobile" aria-label="Mobile navigation"></nav>
  </header>

  <main id="main">

    <!-- ═══════════════════════════════════════════ HERO -->
    <section class="hero" id="top">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__grid"></div>
        <div class="hero__bloom"></div>
      </div>

      <div class="hero__saw-col" aria-hidden="true">
        <div class="saw-scene">
          <div class="saw-ring saw-ring--a"></div>
          <div class="saw-ring saw-ring--b"></div>
          <div class="saw-ring saw-ring--c"></div>
          <svg class="saw-blade" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="bG" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#1877D2" stop-opacity=".18"/>
                <stop offset="100%" stop-color="#0055A4" stop-opacity=".04"/>
              </radialGradient>
              <radialGradient id="cG" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#5BB0FF"/>
                <stop offset="100%" stop-color="#0055A4"/>
              </radialGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- Outer glow disc -->
            <circle cx="200" cy="200" r="190" fill="url(#bG)"/>
            <!-- 36 teeth -->
            <g filter="url(#glow)" stroke="#1877D2" stroke-width="1.4" fill="#090C14">
              <polygon points="200,10 191,36 209,36" transform="rotate(0,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(10,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(20,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(30,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(40,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(50,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(60,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(70,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(80,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(90,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(100,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(110,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(120,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(130,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(140,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(150,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(160,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(170,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(180,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(190,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(200,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(210,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(220,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(230,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(240,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(250,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(260,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(270,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(280,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(290,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(300,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(310,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(320,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(330,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(340,200,200)"/>
              <polygon points="200,10 191,36 209,36" transform="rotate(350,200,200)"/>
            </g>
            <!-- Main disc -->
            <circle cx="200" cy="200" r="162" fill="#070A10" stroke="#1877D2" stroke-width="1.5"/>
            <!-- Rings -->
            <circle cx="200" cy="200" r="148" fill="none" stroke="rgba(58,158,255,.18)" stroke-width="1"/>
            <circle cx="200" cy="200" r="118" fill="none" stroke="rgba(58,158,255,.12)" stroke-width=".8"/>
            <circle cx="200" cy="200" r="78"  fill="none" stroke="rgba(58,158,255,.22)" stroke-width="1.2"/>
            <circle cx="200" cy="200" r="46"  fill="#090C14" stroke="rgba(58,158,255,.3)" stroke-width="1.4"/>
            <!-- 3 spokes -->
            <g stroke="rgba(58,158,255,.25)" stroke-width="1.5" fill="none">
              <line x1="200" y1="50" x2="200" y2="350"/>
              <line x1="200" y1="50" x2="200" y2="350" transform="rotate(60,200,200)"/>
              <line x1="200" y1="50" x2="200" y2="350" transform="rotate(120,200,200)"/>
            </g>
            <!-- Spoke glows -->
            <g stroke="rgba(58,158,255,.55)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)">
              <line x1="200" y1="78" x2="200" y2="152"/>
              <line x1="200" y1="248" x2="200" y2="322"/>
              <line x1="200" y1="78" x2="200" y2="152" transform="rotate(60,200,200)"/>
              <line x1="200" y1="248" x2="200" y2="322" transform="rotate(60,200,200)"/>
              <line x1="200" y1="78" x2="200" y2="152" transform="rotate(120,200,200)"/>
              <line x1="200" y1="248" x2="200" y2="322" transform="rotate(120,200,200)"/>
            </g>
            <!-- Center arbor -->
            <circle cx="200" cy="200" r="18" fill="#080A0E" stroke="#3A9EFF" stroke-width="2" filter="url(#glow)"/>
            <circle cx="200" cy="200" r="9"  fill="url(#cG)"/>
            <!-- Speed glints -->
            <g stroke="rgba(58,158,255,.7)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
              <line x1="200" y1="36" x2="200" y2="18"/>
              <line x1="200" y1="36" x2="200" y2="18" transform="rotate(72,200,200)"/>
              <line x1="200" y1="36" x2="200" y2="18" transform="rotate(144,200,200)"/>
              <line x1="200" y1="36" x2="200" y2="18" transform="rotate(216,200,200)"/>
              <line x1="200" y1="36" x2="200" y2="18" transform="rotate(288,200,200)"/>
            </g>
          </svg>
          <div class="saw-caption">
            <span class="saw-caption__name">FENRIR</span>
            <span class="saw-caption__type">1lb Drum Spinner</span>
          </div>
        </div>
      </div>

      <div class="hero__text-col wrap">
        <div class="hero__text" id="heroContent"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════ TICKER -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker__track">
        <span>Wolf Tech Combat Team</span><span aria-hidden="true">·</span>
        <span>Frisco, TX</span><span aria-hidden="true">·</span>
        <span>Est. 2024</span><span aria-hidden="true">·</span>
        <span>100% Student-Built</span><span aria-hidden="true">·</span>
        <span>3+ Frisco High Schools</span><span aria-hidden="true">·</span>
        <span>Drum Spinner · FENRIR</span><span aria-hidden="true">·</span>
        <span>Wolf Tech Combat Team</span><span aria-hidden="true">·</span>
        <span>Frisco, TX</span><span aria-hidden="true">·</span>
        <span>Est. 2024</span><span aria-hidden="true">·</span>
        <span>100% Student-Built</span><span aria-hidden="true">·</span>
        <span>3+ Frisco High Schools</span><span aria-hidden="true">·</span>
        <span>Drum Spinner · FENRIR</span><span aria-hidden="true">·</span>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════ ABOUT -->
    <section class="section" id="about">
      <div class="wrap" id="aboutContent"></div>
    </section>

    <!-- ═══════════════════════════════════════════ FEATURED BOT -->
    <section class="section section--dark" id="bots">
      <div class="wrap" id="botsContent"></div>
    </section>

    <!-- ═══════════════════════════════════════════ TEAM -->
    <section class="section" id="team">
      <div class="wrap" id="teamContent"></div>
    </section>

    <!-- ═══════════════════════════════════════════ SPONSORS -->
    <section class="section section--dark" id="sponsors">
      <div class="wrap" id="sponsorsContent"></div>
    </section>

    <!-- ═══════════════════════════════════════════ DONATE -->
    <section class="section section--blue" id="donate">
      <div class="wrap" id="donateContent"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap footer__inner" id="footerContent"></div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
